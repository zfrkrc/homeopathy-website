<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yönetici Girişi | {{ site_title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Montserrat:wght@300;400;500&display=swap&subset=latin-ext" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Montserrat',system-ui,sans-serif;background:#f4efe1;display:flex;align-items:center;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
    .login-box{background:#fffdf7;padding:40px;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.06);width:380px;border:1px solid #dcd4bd}
    h1{text-align:center;font-size:22px;color:#202b22;margin-bottom:6px;font-family:'Cormorant Garamond',Georgia,serif}
    .sub{text-align:center;font-size:12px;color:#726f5e;margin-bottom:24px;font-family:monospace;letter-spacing:.08em}
    .flash{padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13px}
    .flash.error{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
    label{display:block;font-size:13px;color:#39473b;margin-bottom:4px;font-weight:500}
    input[type=text],input[type=password]{width:100%;padding:10px 12px;border:1px solid #dcd4bd;border-radius:10px;font-size:14px;margin-bottom:16px;background:#fffdf7;font-family:'Montserrat',system-ui,sans-serif}
    input:focus{outline:none;border-color:#b08d57;box-shadow:0 0 0 3px rgba(176,141,87,.12)}
    button{width:100%;padding:11px;background:#b08d57;color:#fff;border:none;border-radius:10px;font-size:14px;cursor:pointer;font-weight:600;font-family:'Montserrat',system-ui,sans-serif}
    button:hover{background:#9a7b4a}
  </style>
</head>
<body>
  <div class="login-box">
    <h1>🔐 Yönetici Paneli</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST">
      <label>Kullanıcı Adı</label>
      <input type="text" name="username" required autofocus>
      <label>Şifre</label>
      <input type="password" name="password" required>
      <button type="submit">Giriş Yap</button>
    </form>
  </div>
</body>
</html>
