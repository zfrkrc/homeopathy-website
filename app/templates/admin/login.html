<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yönetici Girişi | {{ site_title }}</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:sans-serif;background:#f5f5f5;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .login-box{background:#fff;padding:40px;border-radius:12px;box-shadow:0 2px 20px rgba(0,0,0,.08);width:380px}
    h1{text-align:center;font-size:22px;color:#3d6b4f;margin-bottom:24px}
    .flash{padding:10px 14px;border-radius:6px;margin-bottom:16px;font-size:13px}
    .flash.error{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
    .flash.success{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
    label{display:block;font-size:13px;color:#555;margin-bottom:4px}
    input[type=text],input[type=password]{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;margin-bottom:16px}
    input:focus{outline:none;border-color:#3d6b4f;box-shadow:0 0 0 2px rgba(61,107,79,.15)}
    button{width:100%;padding:11px;background:#3d6b4f;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer}
    button:hover{background:#2d4f3a}
  </style>
</head>
<body>
  <div class="login-box">
    <h1>🔐 Yönetici Paneli</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST">
      <label>Kullanıcı Adı</label>
      <input type="text" name="username" required autofocus>
      <label>Şifre</label>
      <input type="password" name="password" required>
      <button type="submit">Giriş Yap</button>
    </form>
  </div>
</body>
</html>
