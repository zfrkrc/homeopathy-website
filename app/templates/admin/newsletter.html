{% extends "admin/admin_base.html" %}
{% block title %}Mail Gönder | {{ site_title }}{% endblock %}
{% block breadcrumb %}Mail Gönder{% endblock %}
{% block head %}
<style>
.card{background:#fff;padding:24px;border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.05);margin-bottom:24px}
.card h2{font-size:16px;margin-bottom:16px}
input[type=text],textarea,select{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px}
textarea{min-height:300px;font-family:monospace;font-size:13px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:#3d6b4f}
.help{font-size:11px;color:#aaa;margin-top:4px}
</style>
{% endblock %}
{% block content %}
<div class="card">
  <h2>Yeni Mail</h2>
  <form method="POST">
    <label>Konu</label>
    <input type="text" name="subject" required placeholder="Mail başlığı">

    <label>Mesaj (HTML destekler)</label>
    <div class="help">HTML kullanabilirsiniz. &lt;br&gt; satır sonu, &lt;b&gt; kalın, &lt;a&gt; link</div>
    <textarea name="message" placeholder="Merhaba,&#10;&#10;Yeni blog yazımız yayında..."></textarea>

    <label>Alıcılar</label>
    <select name="send_to">
      <option value="active">Sadece aktif aboneler</option>
      <option value="all">Tüm aboneler (pasif dahil)</option>
    </select>

    <div style="margin-top:24px">
      <button type="submit" class="btn btn-primary" onclick="return confirm('{{ count }} aboneye mail gönderilecek. Emin misin?')">📨 Gönder</button>
      <a href="{{ url_for('admin_subscribers') }}" class="btn btn-muted">İptal</a>
    </div>
  </form>
</div>
{% endblock %}
