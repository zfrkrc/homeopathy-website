<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if post %}Yazı Düzenle{% else %}Yeni Yazı{% endif %} | {{ site_title }}</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:sans-serif;background:#f8fafb;color:#333}
    .admin-header{background:#3d6b4f;color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
    .admin-header h1{font-size:18px}
    .admin-header a{color:#fff;text-decoration:none;font-size:13px;opacity:.8}
    .admin-body{padding:24px;max-width:900px;margin:0 auto}
    .flash{padding:10px 14px;border-radius:6px;margin-bottom:16px;font-size:13px}
    .flash.error{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
    label{display:block;font-size:13px;color:#555;margin-bottom:4px;margin-top:16px}
    input[type=text],textarea,select{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px}
    input:focus,textarea:focus{outline:none;border-color:#3d6b4f;box-shadow:0 0 0 2px rgba(61,107,79,.15)}
    textarea{min-height:400px;font-family:monospace;font-size:13px;line-height:1.6;resize:vertical}
    .help{font-size:11px;color:#aaa;margin-top:4px}
    .form-row{display:flex;gap:16px}
    .form-row > div{flex:1}
    .form-actions{margin-top:24px;display:flex;gap:8px}
    .btn{display:inline-block;padding:10px 24px;border-radius:6px;text-decoration:none;font-size:14px;font-weight:500;border:none;cursor:pointer}
    .btn-primary{background:#3d6b4f;color:#fff}
    .btn-primary:hover{background:#2d4f3a}
    .btn-secondary{background:#f0f0f0;color:#555}
    .btn-secondary:hover{background:#e0e0e0}
    .checkbox-row{display:flex;align-items:center;gap:8px;margin-top:16px}
    .checkbox-row input[type=checkbox]{width:auto}
    .checkbox-row label{margin:0}
    .preview-link{display:inline-block;margin-top:12px;font-size:12px;color:#3d6b4f;cursor:pointer;text-decoration:underline}
  </style>
</head>
<body>
  <div class="admin-header">
    <h1>{% if post %}✏️ Yazı Düzenle{% else %}➕ Yeni Yazı{% endif %}</h1>
    <a href="{{ url_for('admin_dashboard') }}">← Paneli Dön</a>
  </div>
  <div class="admin-body">
    <form method="POST">
      <label>Başlık</label>
      <input type="text" name="title" value="{{ post.title if post else '' }}" required>

      <div class="form-row">
        <div>
          <label>URL (slug) - boş bırakılırsa başlıktan oluşur</label>
          <input type="text" name="slug" value="{{ post.slug if post else '' }}" placeholder="ornek-yazi-basligi">
        </div>
        <div>
          <label>Kategori</label>
          <select name="category">
            {% for cat in categories %}
            <option value="{{ cat.name }}" {% if post and post.category==cat.name %}selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
          </select>
          <div class="help"><a href="{{ url_for('admin_categories') }}" style="color:#3d6b4f">Kategorileri Yönet</a></div>
        </div>
      </div>

      <label>Özet (excerpt)</label>
      <input type="text" name="excerpt" value="{{ post.excerpt if post else '' }}" placeholder="Kısa açıklama...">

      <label>İçerik (Markdown destekler)</label>
      <div class="help">**kalın**, *italik*, - liste, # başlık, [link](url), ![resim](url)</div>
      <textarea name="content">{{ post.content if post else '' }}</textarea>

      <div class="checkbox-row">
        <input type="checkbox" name="published" id="published" {% if not post or post.published %}checked{% endif %}>
        <label for="published">Yayınla</label>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">💾 Kaydet</button>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">İptal</a>
      </div>
    </form>
  </div>
</body>
</html>
