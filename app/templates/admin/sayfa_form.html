{% extends "admin/admin_base.html" %}
{% block title %}Yeni Sayfa{% endblock %}
{% block content %}
<h2 style="margin-bottom:20px">📝 Yeni Sayfa</h2>
<form method="POST" style="max-width:480px">
  <div style="margin-bottom:16px">
    <label style="display:block;font-size:13px;font-weight:600;margin-bottom:4px">Sayfa Başlığı</label>
    <input name="title" required placeholder="Sayfa adı" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px">
  </div>
  <div style="margin-bottom:20px">
    <label style="display:block;font-size:13px;font-weight:600;margin-bottom:4px">URL (slug)</label>
    <input name="slug" required placeholder="sayfa-adi" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;font-family:monospace">
    <p style="font-size:11px;color:#888;margin-top:4px">zeyna.zk.net.tr/s/<strong>sayfa-adi</strong></p>
  </div>
  <button type="submit" class="btn" style="background:var(--primary);color:#fff;border:none;padding:10px 24px;border-radius:6px;font-size:14px;cursor:pointer">Oluştur ve Düzenle →</button>
</form>
{% endblock %}
