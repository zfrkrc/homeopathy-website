{% extends "base.html" %}
{% block title %}{{ about_title or 'Hakkımda' }} | {{ site_title }}{% endblock %}
{% block content %}
<div class="container">
  <div class="about-hero">
    <div class="about-img">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <div class="about-text">
      <h1>{{ about_title or 'Hakkımda' }}</h1>
      <div style="font-size:15px;line-height:1.8;color:var(--ink-2,#39473b);white-space:pre-line">{{ about_content or '' }}</div>
    </div>
  </div>
</div>
{% endblock %}
